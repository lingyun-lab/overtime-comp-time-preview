<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>部门管理 - 加班调休管理系统</title>
  <link rel="stylesheet" href="departments.css">
</head>
<body data-active="departments">
  <div class="app">
    <aside id="sidebar" class="sidebar"></aside>
    <section class="workspace">
      <header id="topbar" class="topbar"></header>
      <main class="content">
        <h1 class="page-title">部门管理</h1>
        <p class="page-subtitle">维护组织层级、部门负责人和部门状态，停用需做关联提示。</p>

<section class="card">
  <div class="card-body filter">
    <div class="field"><label>部门名称</label><input id="qName" placeholder="请输入部门名称"></div>
    <div class="field"><label>上级部门</label><input id="qParent" placeholder="请输入上级部门"></div>
    <div class="field"><label>负责人</label><input id="qLeader" placeholder="请输入负责人"></div>
    <div class="field"><label>状态</label><select id="qStatus"><option value="">全部</option><option>启用</option><option>停用</option></select></div>
    <div class="btn-row"><button class="btn primary" onclick="renderDepartments();toast('已查询部门。','success')">查询</button><button class="btn" onclick="resetDepartments()">重置</button></div>
  </div>
</section>
<section class="split">
  <div class="card"><div class="card-head"><div class="card-title">组织树</div></div><div class="card-body"><div id="orgTree" class="tree"></div></div></div>
  <div class="card"><div class="card-head action-only"><div class="btn-row"><button class="btn primary" onclick="openDeptForm()">新增部门</button><button class="btn" onclick="exportConfirm('部门列表')">导出</button></div></div><div class="card-body"><div id="deptTable"></div></div></div>
</section>

      </main>
    </section>
  </div>
  <script src="departments_mock.js"></script>
  <script src="departments.js"></script>
</body>
</html>
