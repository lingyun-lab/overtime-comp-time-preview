<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>加班调休申请 - 加班调休管理系统</title>
  <link rel="stylesheet" href="applications.css">
</head>
<body data-active="applications">
  <div class="app">
    <aside id="sidebar" class="sidebar"></aside>
    <section class="workspace">
      <header id="topbar" class="topbar"></header>
      <main class="content">
        <h1 class="page-title">加班调休申请</h1>
        <p class="page-subtitle">维护本人或授权范围内的加班/调休申请；跨日调休必须按日期拆分明细。</p>

<section class="card">
  <div class="card-body filter">
    <div class="field"><label>申请类型</label><select id="qType"><option value="">全部</option><option>加班申请</option><option>调休申请</option></select></div>
    <div class="field"><label>申请人</label><input id="qApplicant" placeholder="请输入申请人"></div>
    <div class="field"><label>所属部门</label><input id="qDept" placeholder="请输入部门"></div>
    <div class="field"><label>申请时间段</label><div class="date-range"><input id="qStart" type="text" class="date-input" placeholder="yyyy-mm-dd"><span>至</span><input id="qEnd" type="text" class="date-input" placeholder="yyyy-mm-dd"></div></div>
    <div class="field"><label>申请状态</label><select id="qStatus"><option value="">全部</option><option>草稿</option><option>待审批</option><option>已通过</option><option>已驳回</option></select></div>
    <div class="btn-row"><button class="btn primary" onclick="queryApps()">查询</button><button class="btn" onclick="resetApps()">重置</button></div>
  </div>
</section>
<section class="card">
  <div class="card-head action-only"><div class="btn-row"><button class="btn primary" onclick="openAppForm()">新增申请</button><button class="btn" onclick="exportConfirm('申请列表')">导出</button></div></div>
  <div class="card-body"><div id="appTable"></div></div>
</section>

      </main>
    </section>
  </div>
  <script src="applications_mock.js"></script>
  <script src="applications.js"></script>
</body>
</html>
