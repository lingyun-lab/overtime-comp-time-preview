<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>我的待办 - 加班调休管理系统</title>
  <link rel="stylesheet" href="todo.css">
</head>
<body data-active="todo">
  <div class="app">
    <aside id="sidebar" class="sidebar"></aside>
    <section class="workspace">
      <header id="topbar" class="topbar"></header>
      <main class="content">
        <h1 class="page-title">我的待办</h1>
        <p class="page-subtitle">主管处理授权范围内的待审批申请，并核对跨日明细。</p>

<section class="card">
  <div class="card-body filter">
    <div class="field"><label>申请类型</label><select id="qType"><option value="">全部</option><option>加班申请</option><option>调休申请</option></select></div>
    <div class="field"><label>申请人</label><input id="qApplicant" placeholder="请输入申请人"></div>
    <div class="field"><label>所属部门</label><input id="qDept" placeholder="请输入部门"></div>
    <div class="field"><label>申请时间段</label><div class="date-range"><input id="qStart" type="text" class="date-input" placeholder="yyyy-mm-dd"><span>至</span><input id="qEnd" type="text" class="date-input" placeholder="yyyy-mm-dd"></div></div>
    <div class="btn-row"><button class="btn primary" onclick="renderTodo();toast('已查询待办。','success')">查询</button><button class="btn" onclick="resetTodo()">重置</button></div>
  </div>
</section>
<section class="card">
  <div class="card-body"><div id="todoTable"></div></div>
</section>

      </main>
    </section>
  </div>
  <script src="todo_mock.js"></script>
  <script src="todo.js"></script>
</body>
</html>
